<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">ORCA: persistent Pods and evidence-driven adaptation</title><desc id="desc">Human objectives enter ORCA. Persistent Pods activate bounded runs above interchangeable runtimes. Shared services provide policy, memory, scheduling and evidence. The Adapt phase tests plugin changes before promotion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5acddd"/></marker></defs>
<rect width="1000" height="1110" rx="24" fill="#0d1622"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#eef6fc;text-anchor:middle} .h{font-size:25px;font-weight:700}.s{font-size:17px;fill:#bfd0df}.b{fill:#172636;stroke:#416079;stroke-width:2}.a{fill:none;stroke:#5acddd;stroke-width:2;marker-end:url(#arrow)}</style>
<text class="h" x="500" y="45">ORCA</text><text class="s" x="500" y="75">Orchestrated Reasoning, Collaboration &amp; Adaptation</text><rect class="b" x="270" y="100" width="460" height="80" rx="12"/><text class="h" x="500" y="132">Human objectives</text><text class="s" x="500" y="158">Constraints · acceptance criteria · approvals</text><path class="a" d="M500 180V205"/><rect class="b" x="145" y="210" width="710" height="85" rx="12"/><text class="h" x="500" y="242">ORCA coordination</text><text class="s" x="500" y="268">Missions · team formation · resources · cross-pod cooperation</text><path class="a" d="M500 295V320"/><text class="s" x="500" y="344">Persistent specialized Pods · agents activate on demand</text><rect class="b" x="40" y="365" width="290" height="80" rx="12"/><text class="h" x="185" y="397">Development Pod</text><text class="s" x="185" y="423">Roles · skills · memory · history</text><rect class="b" x="355" y="365" width="290" height="80" rx="12"/><text class="h" x="500" y="397">Research Pod</text><text class="s" x="500" y="423">Roles · skills · memory · history</text><rect class="b" x="670" y="365" width="290" height="80" rx="12"/><text class="h" x="815" y="397">Guardian Pod</text><text class="s" x="815" y="423">Roles · skills · memory · history</text><rect x="40" y="465" width="920" height="100" rx="12" fill="#12323b" stroke="#5acddd"/><text class="h" x="500" y="497">Each Pod: a logical harness</text><text x="500" y="531" font-size="20">Plan → Execute → Test → Evaluate → Adapt → Remember</text><path class="a" d="M185 445V465"/><path class="a" d="M500 445V465"/><path class="a" d="M815 445V465"/><rect class="b" x="40" y="590" width="440" height="90" rx="12"/><text class="h" x="260" y="622">Shared services</text><text class="s" x="260" y="648">Policy · budgets · scheduling</text><text class="s" x="260" y="664">Scoped memory · durable events · artifacts</text><rect class="b" x="520" y="590" width="440" height="90" rx="12"/><text class="h" x="740" y="622">Plugin composition</text><text class="s" x="740" y="648">Roles · skills · models · workflow nodes</text><text class="s" x="740" y="664">Evaluators · retrievers · runtime adapters</text><path class="a" d="M260 565V590"/><path class="a" d="M740 565V590"/><rect class="b" x="145" y="710" width="710" height="85" rx="12"/><text class="h" x="500" y="742">Interchangeable runtime adapters</text><text class="s" x="500" y="768">DeepSeek Harness target · future NC Brain runtimes</text><path class="a" d="M500 680V710"/><rect class="b" x="145" y="825" width="710" height="85" rx="12"/><text class="h" x="500" y="857">Enforced execution boundary</text><text class="s" x="500" y="883">Tool gateway · isolated workspaces · models · infrastructure</text><path class="a" d="M500 795V825"/><rect x="40" y="940" width="920" height="110" rx="12" fill="#12323b" stroke="#5acddd"/><text class="h" x="500" y="974">Adapt: replace the smallest component that needs repair</text><text class="s" x="500" y="1005">Propose → sandbox → compare → approve → promote or roll back</text><text class="s" x="500" y="1032">Versioned compositions · pinned runs · unchanged permission ceilings</text><text class="s" x="500" y="1084">Experimental proposal · integrations and performance remain unverified</text></svg>